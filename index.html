<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deperchas — Generador de Estados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f5f2;--surface:#fff;--border:#e8e4de;--text:#1a1714;--muted:#8a847c;--accent:#b5704a;--accent-light:#f2ebe3;--radius:14px;--radius-sm:8px;--green:#25D366;--teal:#4fa3a0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.topbar-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:var(--accent)}
.topbar-link{font-size:12px;color:var(--accent);font-weight:500;background:var(--accent-light);padding:5px 12px;border-radius:20px}
.app{max-width:960px;margin:0 auto;padding:2rem 1rem 4rem}
.panel{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:1.5rem;margin-bottom:1.5rem}
.panel h2{font-size:15px;font-weight:500;margin-bottom:1rem}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem;align-items:center}
.filter-tag{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
.filter-tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-input{padding:7px 12px;font-size:13px;font-family:'DM Sans',sans-serif;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);outline:none;width:200px}
.filter-input:focus{border-color:var(--accent)}
.btn-reload{padding:7px 14px;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:var(--radius-sm);border:1px solid var(--teal);background:#f0fafa;color:var(--teal);cursor:pointer}
.btn-reload:hover{background:var(--teal);color:#fff}

/* Productos grid */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod-card{background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:all .15s;position:relative}
.prod-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.prod-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.prod-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--border)}
.prod-card-body{padding:8px}
.prod-card-name{font-size:11px;font-weight:500;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-card-price{font-size:11px;color:var(--accent);font-weight:500}
.prod-card-cat{font-size:10px;color:var(--muted)}
.prod-card-check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;font-weight:700}
.prod-card.selected .prod-card-check{display:flex}
.prod-ahora{position:absolute;top:6px;left:6px;background:var(--teal);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px}

/* Seleccion barra */
.sel-bar{background:var(--accent-light);border-radius:var(--radius-sm);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;display:none}
.sel-bar span{font-size:13px;color:var(--accent);font-weight:500}
.sel-bar-actions{display:flex;gap:8px}
.btn-generar{padding:8px 18px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;cursor:pointer}
.btn-generar:hover{opacity:.88}
.btn-desel{padding:8px 12px;font-size:12px;font-family:'DM Sans',sans-serif;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}

/* Badges */
.badges-panel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.badge-opt{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .12s;user-select:none}
.badge-opt.active{border-color:var(--accent);color:var(--accent);background:var(--accent-light);font-weight:500}

/* Progress */
.progress-bar{background:var(--border);border-radius:4px;height:6px;margin:12px 0}
.progress-fill{background:var(--accent);height:6px;border-radius:4px;transition:width .3s;width:0}
.progress-txt{font-size:12px;color:var(--muted);text-align:center}

/* Carrusel */
.carrusel-panel{background:var(--surface);border-radius:var(--radius);border:2px solid var(--teal);padding:1.5rem;margin-bottom:1.5rem;display:none}
.carrusel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.carrusel-header h2{font-size:15px;font-weight:500;color:var(--teal)}
.carrusel-counter{font-size:13px;color:var(--muted)}
.carrusel-img{width:100%;max-height:420px;object-fit:contain;border-radius:var(--radius-sm);display:block;margin-bottom:1rem;background:var(--bg)}
.carrusel-nombre{font-family:'Playfair Display',serif;font-style:italic;font-size:17px;color:var(--text);margin-bottom:4px}
.carrusel-tipo{font-size:11px;color:var(--muted);margin-bottom:.75rem}
.carrusel-caption{font-size:12px;color:var(--muted);background:var(--bg);border-radius:var(--radius-sm);padding:10px;margin-bottom:1rem;line-height:1.6;white-space:pre-line}
.cp-dots{display:flex;gap:4px;margin-bottom:1rem}
.cp-dot{height:4px;flex:1;border-radius:2px;background:var(--border);transition:background .2s}
.cp-dot.done{background:var(--teal)}
.cp-dot.current{background:var(--accent)}
.btn-wp{width:100%;padding:15px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:var(--radius-sm);border:none;background:var(--green);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.btn-wp:hover{opacity:.88}
.btn-copy-open{width:100%;padding:11px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:var(--radius-sm);border:1px solid var(--green);background:#f0fdf4;color:#1a7a3a;cursor:pointer;margin-bottom:8px}
.btn-copy-open:hover{background:var(--green);color:#fff}
.btn-dl-car{width:100%;padding:10px;font-size:12px;font-family:'DM Sans',sans-serif;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;margin-bottom:8px}
.btn-skip{width:100%;padding:9px;font-size:12px;font-family:'DM Sans',sans-serif;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}

/* Resultados */
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:1rem}
.res-card{background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden}
.res-card img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.res-card-body{padding:8px}
.res-card-name{font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.res-card-type{font-size:10px;color:var(--muted);margin-bottom:6px}
.res-actions{display:flex;gap:4px}
.btn-dl-r{flex:1;padding:5px;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:5px;border:1px solid var(--accent);background:var(--accent-light);color:var(--accent);cursor:pointer}
.btn-dl-r:hover{background:var(--accent);color:#fff}
.btn-sh-r{flex:1;padding:5px;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:5px;border:1px solid var(--green);background:#f0fdf4;color:#1a7a3a;cursor:pointer}
.btn-sh-r:hover{background:var(--green);color:#fff}
.btn-dl-all{width:100%;padding:11px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:var(--radius-sm);border:1px solid var(--accent);background:var(--accent-light);color:var(--accent);cursor:pointer;margin-bottom:.5rem}
.btn-dl-all:hover{background:var(--accent);color:#fff}
.btn-car-start{width:100%;padding:11px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:var(--radius-sm);border:1px solid var(--teal);background:#f0fafa;color:var(--teal);cursor:pointer;margin-bottom:.75rem}
.btn-car-start:hover{background:var(--teal);color:#fff}

.loading{text-align:center;padding:3rem;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:13px}
input[type=file]{display:none}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1a1714;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">Deperchas</span>
  <span class="topbar-link">deperchas.com</span>
</div>

<div class="app">

  <!-- Panel productos -->
  <div class="panel">
    <h2>Productos del catálogo</h2>
    <div class="filters">
      <input class="filter-input" id="searchInput" placeholder="Buscar prenda..." oninput="filtrarProductos()">
      <span class="filter-tag active" data-cat="todos" onclick="setCat(this,'todos')">Todos</span>
      <span class="filter-tag" data-cat="publicar_ahora" onclick="setCat(this,'publicar_ahora')">⚡ Publicar ahora</span>
      <button class="btn-reload" onclick="cargarProductos()">↺ Actualizar</button>
    </div>
    <div id="catFilters" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem"></div>
    <div class="sel-bar" id="selBar">
      <span id="selCount">0 seleccionados</span>
      <div class="sel-bar-actions">
        <button class="btn-desel" onclick="deselAll()">Limpiar</button>
        <button class="btn-generar" onclick="mostrarPanelGenerar()">Generar imágenes →</button>
      </div>
    </div>
    <div id="productsWrap"><div class="loading">Cargando productos...</div></div>
  </div>

  <!-- Panel generar -->
  <div class="panel" id="panelGenerar" style="display:none">
    <h2>Opciones de generación</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:1rem">La <strong>primera foto</strong> será el lookbook limpio. La <strong>última foto</strong> será la ficha con precio y badges.</p>
    <div class="badges-panel" id="badgesPanel"></div>
    <div class="progress-bar" id="progBar" style="display:none"><div class="progress-fill" id="progFill"></div></div>
    <p class="progress-txt" id="progTxt"></p>
    <button class="btn-generar" style="width:100%;padding:13px;margin-top:.5rem;font-size:14px" id="btnGen" onclick="generarTodas()">Generar imágenes</button>
  </div>

  <!-- Resultados -->
  <div class="panel" id="resultsPanel" style="display:none">
    <h2>✓ Imágenes listas</h2>
    <button class="btn-car-start" onclick="iniciarCarrusel()">📲 Modo envío uno por uno</button>
    <button class="btn-dl-all" onclick="dlTodas()">⬇ Descargar todas</button>
    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <!-- Carrusel -->
  <div class="carrusel-panel" id="carruselPanel">
    <div class="carrusel-header">
      <h2>📲 Modo envío</h2>
      <span class="carrusel-counter" id="carruselCounter"></span>
    </div>
    <div class="cp-dots" id="cpDots"></div>
    <img class="carrusel-img" id="carruselImg" src="" alt="">
    <div class="carrusel-nombre" id="carruselNombre"></div>
    <div class="carrusel-tipo" id="carruselTipo"></div>
    <div class="carrusel-caption" id="carruselCaption"></div>

      Enviar al Estado de WhatsApp
    </button>
    <button class="btn-copy-open" onclick="copiarYAbrirWP()">💬 Copiar caption y abrir WhatsApp Web</button>
    <button class="btn-dl-car" onclick="descargarActual()">⬇ Solo descargar</button>
    <button class="btn-skip" onclick="siguienteCarrusel()">Saltar → siguiente</button>
  </div>


</div>

let allProducts = [];
let filtered = [];
let selected = {};

let activeBadges = [];
let results = [];
let carruselIdx = 0;

const logoImg = new Image(); logoImg.src = LOGO_SRC;

function fmt(n){ return '$' + Math.round(n).toLocaleString('es-AR'); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// CARGAR PRODUCTOS
async function cargarProductos(){
  document.getElementById('productsWrap').innerHTML = '<div class="loading">Cargando productos...</div>';
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/products?select=*&order=created_at.desc', {
      headers: {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY}
    });
    allProducts = await res.json();
    renderCatFilters();
    filtrarProductos();
  } catch(e) {
    document.getElementById('productsWrap').innerHTML = '<div class="empty">Error al cargar productos. Verificá la conexión.</div>';
  }
}

function renderCatFilters(){
  const cats = [...new Set(allProducts.map(p=>p.category).filter(Boolean))];
  const el = document.getElementById('catFilters'); el.innerHTML='';
  cats.forEach(c=>{
    const tag = document.createElement('span');
    tag.className = 'filter-tag' + (activeCatFilter===c?' active':'');
    tag.textContent = c; tag.onclick = ()=>setCat(tag, c);
    el.appendChild(tag);
  });
}

function setCat(el, cat){
  document.querySelectorAll('.filter-tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  activeCatFilter = cat;
  filtrarProductos();
}

function filtrarProductos(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  filtered = allProducts.filter(p=>{
    const matchSearch = !q || (p.name||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q);
    const matchCat = activeCatFilter==='todos' ? true : activeCatFilter==='publicar_ahora' ? p.publicar_ahora : p.category===activeCatFilter;
    return matchSearch && matchCat;
  });
  renderProductos();
}

function renderProductos(){
  const wrap = document.getElementById('productsWrap');
  if(!filtered.length){ wrap.innerHTML='<div class="empty">No hay productos con ese filtro</div>'; return; }
  const grid = document.createElement('div'); grid.className='products-grid';
  filtered.forEach(p=>{
    const imgs = [p.image,p.image2,p.image3,p.image4,p.image5,p.image6,p.image7].filter(Boolean);
    const card = document.createElement('div');
    card.className = 'prod-card' + (selected[p.id]?' selected':'');
    card.onclick = ()=>toggleSelect(p, card);
    if(p.publicar_ahora){ const badge=document.createElement('div'); badge.className='prod-ahora'; badge.textContent='⚡ HOY'; card.appendChild(badge); }
    const check = document.createElement('div'); check.className='prod-card-check'; check.textContent='✓'; card.appendChild(check);
    if(imgs[0]){ const img=document.createElement('img'); img.src=imgs[0]; img.alt=p.name; img.loading='lazy'; card.appendChild(img); }
    else { const ph=document.createElement('div'); ph.style.cssText='width:100%;aspect-ratio:1;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:24px'; ph.textContent='🛍'; card.appendChild(ph); }
    const body=document.createElement('div'); body.className='prod-card-body';
    body.innerHTML='<div class="prod-card-name">'+(p.name||'Sin nombre')+'</div><div class="prod-card-price">'+(p.price?fmt(p.price):'')+'</div><div class="prod-card-cat">'+(p.category||'')+'</div>';
    card.appendChild(body); grid.appendChild(card);
  });
  wrap.innerHTML=''; wrap.appendChild(grid);
  updateSelBar();
}

function toggleSelect(p, card){
  if(selected[p.id]) delete selected[p.id];
  else selected[p.id] = p;
  card.classList.toggle('selected', !!selected[p.id]);
  updateSelBar();
}

function deselAll(){
  selected={};
  document.querySelectorAll('.prod-card').forEach(c=>c.classList.remove('selected'));
  updateSelBar();
}

function updateSelBar(){
  const n = Object.keys(selected).length;
  const bar = document.getElementById('selBar');
  bar.style.display = n>0?'flex':'none';
  document.getElementById('selCount').textContent = n + ' prenda'+(n>1?'s':'')+' seleccionada'+(n>1?'s':'');
}

function mostrarPanelGenerar(){
  const panel = document.getElementById('panelGenerar');
  panel.style.display='';
  const bp = document.getElementById('badgesPanel'); bp.innerHTML='';
  BADGE_OPTS.forEach(b=>{
    const tag=document.createElement('span'); tag.className='badge-opt'+(activeBadges.includes(b)?' active':'');
    tag.textContent=b; tag.onclick=()=>{if(activeBadges.includes(b))activeBadges=activeBadges.filter(x=>x!==b);else activeBadges.push(b);tag.classList.toggle('active',activeBadges.includes(b));};
    bp.appendChild(tag);
  });
  panel.scrollIntoView({behavior:'smooth'});
}

// GENERAR
async function generarTodas(){
  const prods = Object.values(selected);
  if(!prods.length) return;
  results=[];
  const btn=document.getElementById('btnGen'); btn.disabled=true;
  const progBar=document.getElementById('progBar'); progBar.style.display='';
  const progFill=document.getElementById('progFill');
  const progTxt=document.getElementById('progTxt');
  let total=0;
  prods.forEach(p=>{ const imgs=[p.image,p.image2,p.image3,p.image4,p.image5,p.image6,p.image7].filter(Boolean); total+=imgs.length; });
  let done=0;
  for(const p of prods){
    const imgs=[p.image,p.image2,p.image3,p.image4,p.image5,p.image6,p.image7].filter(Boolean);
    if(!imgs.length) continue;
    for(let i=0;i<imgs.length;i++){
      progTxt.textContent=p.name+' — foto '+(i+1)+' de '+imgs.length;
      const esUltima = i===imgs.length-1;
      const blob = esUltima ? await genFicha(p, imgs[i]) : await genLookbook(p, imgs[i]);
      results.push({nombre:p.name, blob, src:imgs[i], tipo:esUltima?'Ficha precio':'Lookbook', product:p});
      done++; progFill.style.width=(done/total*100)+'%';
    }
  }
  progTxt.textContent='✓ ¡Listas! '+results.length+' imágenes generadas';
  btn.disabled=false;
  document.getElementById('panelGenerar').style.display='none';
  renderResults();
}

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('No se pudo cargar: '+src));
    img.src=src;
  });
}

async function genLookbook(p, imgSrc){
  const W=1080,H=1920,canvas=document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  try{
    const photo=await loadImage(imgSrc);
    const scale=Math.max(W/photo.width,H/photo.height);
    ctx.drawImage(photo,(W-photo.width*scale)/2,(H-photo.height*scale)/2,photo.width*scale,photo.height*scale);
  }catch{ctx.fillStyle='#e8e4de';ctx.fillRect(0,0,W,H);}
  const grad=ctx.createLinearGradient(0,H*0.78,0,H);
  grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,0,0.38)');
  ctx.fillStyle=grad;ctx.fillRect(0,H*0.78,W,H*0.22);
  // Calcular altura de caja dinamicamente segun nombre
  const pad=48,nS=46,lS=36;
  const boxX=pad, boxW=W-pad*2;
  // Medir cuantas lineas ocupa el nombre
  const tmpCanvas=document.createElement('canvas');
  const tmpCtx=tmpCanvas.getContext('2d');
  tmpCtx.font='italic 400 '+nS+'px Georgia,serif';
  const words=(p.name||'').split(' ');
  let line='',lines=[];
  words.forEach(w=>{const t=line+w+' ';if(tmpCtx.measureText(t).width>boxW-56&&line){lines.push(line);line=w+' ';}else line=t;});
  lines.push(line);
  const nombreH=lines.length*(nS+10);
  const boxH=nombreH+lS+52;
  const boxY=H-pad-boxH;
  ctx.save();ctx.beginPath();roundRect(ctx,boxX,boxY,boxW,boxH,18);ctx.fillStyle='rgba(20,16,13,0.58)';ctx.fill();ctx.restore();
  ctx.save();ctx.font='italic 400 '+nS+'px Georgia,serif';ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=8;ctx.textAlign='left';
  let ty=boxY+nS+16;
  lines.forEach(l=>{ctx.fillText(l.trim(),boxX+28,ty);ty+=nS+10;});
  ctx.restore();
  ctx.save();ctx.font='300 '+lS+'px sans-serif';ctx.fillStyle='rgba(255,255,255,0.75)';ctx.textAlign='left';ctx.fillText(LINK,boxX+28,ty+8);ctx.restore();
  return new Promise(r=>canvas.toBlob(b=>r(b),'image/jpeg',0.93));
}

async function genFicha(p, imgSrc){
  const W=1080,H=1920,canvas=document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  try{
    const photo=await loadImage(imgSrc);
    const scale=Math.max(W/photo.width,H/photo.height);
    ctx.drawImage(photo,(W-photo.width*scale)/2,(H-photo.height*scale)/2,photo.width*scale,photo.height*scale);
  }catch{ctx.fillStyle='#e8e4de';ctx.fillRect(0,0,W,H);}
  // Calcular altura real del contenido para no dejar espacio vacío
  const pad=60;
  let contentH = 0;
  if(activeBadges.length>0) contentH += 80;
  const nombreLineas = Math.ceil(ctx.measureText(p.name||'').width / (W - pad*2 - 40) * 62/62) || (p.name||'').length > 28 ? 2 : 1;
  contentH += nombreLineas === 2 ? 160 : 90;
  contentH += 50; // separador
  if(p.price) contentH += 38+24 + 46+24 + 54+24 + 20; // 3 filas de precios
  contentH += 50 + 38; // separador + link
  contentH += 60; // padding inferior

  const panelH = Math.min(contentH + 40, H * 0.56);
  const grad=ctx.createLinearGradient(0,H-panelH-120,0,H);
  grad.addColorStop(0,'rgba(20,16,13,0)');grad.addColorStop(0.15,'rgba(20,16,13,0.93)');grad.addColorStop(1,'rgba(20,16,13,0.98)');
  ctx.fillStyle=grad;ctx.fillRect(0,H-panelH-120,W,panelH+120);
  let y=H-panelH+40;
  if(activeBadges.length>0){
    activeBadges.forEach((b,i)=>{
      const bx=pad+i*250;
      ctx.save();ctx.beginPath();roundRect(ctx,bx,y,230,54,27);
      ctx.fillStyle=b==='NOVEDAD'?'#4fa3a0':b==='OFERTA'?'#c0392b':b==='ÚLTIMAS UNIDADES'?'#d4a017':'#6c7a89';
      ctx.fill();ctx.restore();
      ctx.save();ctx.font='bold 26px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(b,bx+115,y+36);ctx.restore();
    });
    y+=80;
  }
  ctx.save();ctx.font='italic 500 62px Georgia,serif';ctx.fillStyle='#fff';ctx.textAlign='left';ctx.shadowColor='rgba(0,0,0,0.3)';ctx.shadowBlur=6;
  wrapText(ctx,p.name||'',pad,y,W-pad*2,70);ctx.restore();
  y+=( (p.name||'').length>28)?155:85;
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();ctx.restore();
  y+=46;
  if(p.price){
    const lista=parseFloat(p.price),transf=lista*0.9,efectivo=lista*0.8;
    [{label:'Precio de lista',amount:fmt(lista),color:'rgba(255,255,255,0.55)',size:38},
     {label:'Transferencia  −10%',amount:fmt(transf),color:'#a8d8b9',size:46},
     {label:'Efectivo  −20%',amount:fmt(efectivo),color:'#f5c97a',size:54}].forEach(row=>{
      ctx.save();ctx.font=row.size+'px sans-serif';ctx.fillStyle='rgba(255,255,255,0.42)';ctx.textAlign='left';ctx.fillText(row.label,pad,y);ctx.restore();
      ctx.save();ctx.font='500 '+row.size+'px sans-serif';ctx.fillStyle=row.color;ctx.textAlign='right';ctx.fillText(row.amount,W-pad,y);ctx.restore();
      y+=row.size+24;
    });
    y+=16;
  }
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();ctx.restore();y+=38;
  ctx.save();ctx.font='300 32px sans-serif';ctx.fillStyle='rgba(255,255,255,0.38)';ctx.textAlign='left';ctx.fillText(LINK,pad,y);ctx.restore();
  return new Promise(r=>canvas.toBlob(b=>r(b),'image/jpeg',0.93));
}

// CARRUSEL
function iniciarCarrusel(){ 
  if(!results.length){ alert('No hay imágenes generadas'); return; }
  carruselIdx=0; 
  mostrarCarrusel(); 
}

function mostrarCarrusel(){
  if(carruselIdx>=results.length){ 
    document.getElementById('carruselPanel').style.display='none'; 
    toast('✓ Todas las imágenes enviadas'); 
    return; 
  }
  const r=results[carruselIdx];
  const panel=document.getElementById('carruselPanel');
  panel.style.display='block';
  panel.style.visibility='visible';
  document.getElementById('carruselCounter').textContent=(carruselIdx+1)+' de '+results.length;
  document.getElementById('carruselNombre').textContent=r.nombre;
  document.getElementById('carruselTipo').textContent=r.tipo==='Ficha precio'?'📋 Ficha con precio y descuentos':'🖼 Lookbook';
  document.getElementById('carruselCaption').textContent=generarCaption(r);
  document.getElementById('carruselImg').src=URL.createObjectURL(r.blob);
  const dots=document.getElementById('cpDots'); dots.innerHTML='';
  results.forEach((_,i)=>{const d=document.createElement('div');d.className='cp-dot'+(i<carruselIdx?' done':i===carruselIdx?' current':'');dots.appendChild(d);});
  document.getElementById('carruselPanel').scrollIntoView({behavior:'smooth',block:'start'});
}

function generarCaption(r){
  const p=r.product;
  let txt=r.nombre+'\n';
  if(r.tipo==='Ficha precio' && p.price){
    const lista=parseFloat(p.price);
    txt+='Lista: '+fmt(lista)+'\n';
    txt+='Transferencia: '+fmt(lista*0.9)+' (−10%)\n';
    txt+='Efectivo: '+fmt(lista*0.8)+' (−20%)\n';
  }
  if(activeBadges.length) txt+=activeBadges.join(' · ')+'\n';
  txt+='🔗 '+LINK;
  return txt;
}

function siguienteCarrusel(){ carruselIdx++; mostrarCarrusel(); }

async function compartirActual(){
  const r=results[carruselIdx];
  const esMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(esMobile && navigator.share){
    const file=new File([r.blob],'deperchas.jpg',{type:'image/jpeg'});
    try{await navigator.share({files:[file],title:r.nombre,text:generarCaption(r)});setTimeout(()=>siguienteCarrusel(),800);return;}
    catch(e){if(e.name==='AbortError')return;}
  }
  copiarYAbrirWP();
}

let wpAbierto = false;
async function copiarYAbrirWP(){
  const r=results[carruselIdx];
  const caption=generarCaption(r);
  try{await navigator.clipboard.writeText(caption);}catch{}
  descargarActual(false);
  if(!wpAbierto){
    window.open('https://web.whatsapp.com','whatsapp_deperchas');
    wpAbierto = true;
    toast('WhatsApp Web abierto · imagen descargada · caption copiado');
  } else {
    window.open('https://web.whatsapp.com','whatsapp_deperchas');
    toast('Imagen descargada · caption copiado — pasá a la siguiente en WhatsApp');
  }
}

function descargarActual(avanzar=true){
  const r=results[carruselIdx];
  const fname=(r.nombre||'prenda').toLowerCase().replace(/[^a-z0-9]/gi,'-');
  const a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download='deperchas-'+fname+(r.tipo==='Ficha precio'?'-ficha':'')+'.jpg';a.click();
  if(avanzar) setTimeout(()=>siguienteCarrusel(),400);
}

function dlTodas(){ results.forEach((r,i)=>setTimeout(()=>{const fname=(r.nombre||'prenda').toLowerCase().replace(/[^a-z0-9]/gi,'-');const a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download='deperchas-'+fname+(r.tipo==='Ficha precio'?'-ficha':'')+'.jpg';a.click();},i*400)); }

function renderResults(){
  const panel=document.getElementById('resultsPanel'),grid=document.getElementById('resultsGrid');
  if(!results.length){panel.style.display='none';return;}
  panel.style.display='';grid.innerHTML='';
  results.forEach((r,i)=>{
    const card=document.createElement('div');card.className='res-card';
    const img=document.createElement('img');img.src=r.src;img.crossOrigin='anonymous';card.appendChild(img);
    const body=document.createElement('div');body.className='res-card-body';
    body.innerHTML='<div class="res-card-name">'+r.nombre+'</div><div class="res-card-type">'+r.tipo+'</div>';
    const actions=document.createElement('div');actions.className='res-actions';
    const btnDl=document.createElement('button');btnDl.className='btn-dl-r';btnDl.textContent='⬇';btnDl.onclick=()=>{const fname=(r.nombre||'').toLowerCase().replace(/[^a-z0-9]/gi,'-');const a=document.createElement('a');a.href=URL.createObjectURL(r.blob);a.download='deperchas-'+fname+'.jpg';a.click();};
    const btnSh=document.createElement('button');btnSh.className='btn-sh-r';btnSh.textContent='↗';btnSh.onclick=()=>{carruselIdx=i;mostrarCarrusel();document.getElementById('carruselPanel').scrollIntoView({behavior:'smooth',block:'start'}); };
    actions.appendChild(btnDl);actions.appendChild(btnSh);body.appendChild(actions);card.appendChild(body);grid.appendChild(card);
  });
  panel.scrollIntoView({behavior:'smooth'});
}

function wrapText(ctx,text,x,y,maxW,lh){const words=text.split(' ');let line='';for(let i=0;i<words.length;i++){const test=line+words[i]+' ';if(ctx.measureText(test).width>maxW&&i>0){ctx.fillText(line,x,y);line=words[i]+' ';y+=lh;}else line=test;}ctx.fillText(line,x,y);}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

cargarProductos();
</script>
