<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deperchas — Generador de Estados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f5f2;--surface:#fff;--border:#e8e4de;--text:#1a1714;--muted:#8a847c;--accent:#b5704a;--accent-light:#f2ebe3;--radius:14px;--radius-sm:8px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;gap:12px}
.topbar-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:var(--accent)}
.topbar-sub{font-size:12px;color:var(--muted)}
.app{max-width:1000px;margin:0 auto;padding:2rem 1rem 4rem}
.panel{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:1.5rem;margin-bottom:1.5rem}
.panel h2{font-size:15px;font-weight:500;margin-bottom:1rem}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:2rem 1rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
.upload-area:hover,.upload-area.drag{border-color:var(--accent);background:var(--accent-light)}
.upload-area svg{display:block;margin:0 auto 10px;opacity:.35}
.upload-area span{font-size:13px;color:var(--muted)}
.upload-area small{font-size:11px;color:var(--muted);opacity:.7;display:block;margin-top:4px}

/* Cola de edicion */
.edit-grid{display:flex;flex-direction:column;gap:10px;margin-top:1rem}
.edit-item{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);padding:10px}
.edit-item img{width:60px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0}
.edit-item input{flex:1;padding:8px 12px;font-size:13px;font-family:'DM Sans',sans-serif;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none}
.edit-item input:focus{border-color:var(--accent)}
.edit-item .cats-mini{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.edit-item-inner{flex:1;min-width:0}
.cat-mini{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .12s;white-space:nowrap}
.cat-mini:hover{border-color:var(--accent);color:var(--accent)}
.cat-mini.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-rm{padding:6px 8px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;flex-shrink:0}
.btn-rm:hover{border-color:#e57373;color:#e57373}

/* Categorias globales */
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.cat{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
.cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-add{font-size:12px;padding:5px 10px;border-radius:20px;border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif}
.cat-add:hover{border-color:var(--accent);color:var(--accent)}

.btn-gen-all{width:100%;padding:13px;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;cursor:pointer;transition:opacity .15s;margin-top:1rem}
.btn-gen-all:hover{opacity:.88}
.btn-gen-all:disabled{opacity:.4;cursor:not-allowed}

/* Resultados */
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:1rem}
.res-card{background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden}
.res-card img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.res-card-body{padding:8px}
.res-card-name{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.btn-dl-res{width:100%;padding:6px;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:6px;border:1px solid var(--accent);background:var(--accent-light);color:var(--accent);cursor:pointer;transition:all .15s}
.btn-dl-res:hover{background:var(--accent);color:#fff}
.btn-dl-all{width:100%;padding:11px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;border-radius:var(--radius-sm);border:1px solid var(--accent);background:var(--accent-light);color:var(--accent);cursor:pointer;transition:all .15s;margin-bottom:1rem}
.btn-dl-all:hover{background:var(--accent);color:#fff}

.empty-res{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:13px}
.empty-res svg{display:block;margin:0 auto 10px;opacity:.2}

input[type=file]{display:none}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:1.5rem;width:90%;max-width:300px}
.modal h3{font-size:15px;font-weight:500;margin-bottom:12px}
.modal input{width:100%;padding:9px 12px;font-size:13px;font-family:'DM Sans',sans-serif;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);outline:none}
.modal input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions button{flex:1;padding:9px;font-size:13px;font-family:'DM Sans',sans-serif;border-radius:var(--radius-sm);cursor:pointer;font-weight:500}
.btn-cancel{border:1px solid var(--border);background:transparent;color:var(--muted)}
.btn-confirm{border:none;background:var(--accent);color:#fff}
.progress{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">Deperchas</span>
  <span class="topbar-sub">Generador de estados · deperchas.com</span>
</div>

<div class="app">

  <!-- Paso 1: subir fotos -->
  <div class="panel">
    <h2>1. Subí las fotos</h2>
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1a1714" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>Tocá para subir fotos — podés elegir varias a la vez</span>
      <small>JPG o PNG</small>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="edit-grid" id="editGrid"></div>
  </div>

  <!-- Paso 2: categoría por defecto -->
  <div class="panel" id="step2" style="display:none">
    <h2>2. Categoría por defecto</h2>
    <div class="cats" id="cats"></div>
    <button class="btn-gen-all" id="btnGenAll" onclick="generarTodas()">Generar todas las imágenes</button>
    <div class="progress" id="progress"></div>
  </div>

  <!-- Resultados -->
  <div class="panel" id="resultsPanel" style="display:none">
    <h2>Imágenes listas</h2>
    <button class="btn-dl-all" id="btnDlAll">Descargar todas</button>
    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <div class="panel" id="emptyPanel">
    <div class="empty-res">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1a1714" stroke-width="1.2">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
      </svg>
      Subí las fotos arriba para empezar
    </div>
  </div>

</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Nueva categoría</h3>
    <input type="text" id="catInput" placeholder="Ej: Zapatos" maxlength="30">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmCat()">Agregar</button>
    </div>
  </div>
</div>

let cats = JSON.parse(localStorage.getItem('dep_cats') || '["Ropa","Accesorios","Collares","Vitrofusión","Zapatos"]');
let activeCat = cats[0];
let pending = []; // {src, nombre, cat, id}
let results = []; // {src, nombre, blob}
const logoImg = new Image();
logoImg.src = LOGO_SRC;

// Upload múltiple
document.getElementById('fileInput').onchange = function(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      pending.push({ src: ev.target.result, nombre: '', cat: activeCat, id: Date.now() + Math.random() });
      loaded++;
      if (loaded === files.length) { renderEditGrid(); checkStep2(); }
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
};

const ua = document.getElementById('uploadArea');
ua.addEventListener('dragover', e => { e.preventDefault(); ua.classList.add('drag'); });
ua.addEventListener('dragleave', () => ua.classList.remove('drag'));
ua.addEventListener('drop', e => {
  e.preventDefault(); ua.classList.remove('drag');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      pending.push({ src: ev.target.result, nombre: '', cat: activeCat, id: Date.now() + Math.random() });
      loaded++;
      if (loaded === files.length) { renderEditGrid(); checkStep2(); }
    };
    reader.readAsDataURL(file);
  });
});

function renderEditGrid() {
  const grid = document.getElementById('editGrid');
  grid.innerHTML = '';
  pending.forEach(item => {
    const div = document.createElement('div');
    div.className = 'edit-item';
    const img = document.createElement('img');
    img.src = item.src;
    div.appendChild(img);
    const inner = document.createElement('div');
    inner.className = 'edit-item-inner';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Nombre de la prenda';
    inp.value = item.nombre;
    inp.oninput = () => { item.nombre = inp.value; checkStep2(); };
    inner.appendChild(inp);
    const catsDiv = document.createElement('div');
    catsDiv.className = 'cats-mini';
    cats.forEach(c => {
      const tag = document.createElement('span');
      tag.className = 'cat-mini' + (item.cat === c ? ' active' : '');
      tag.textContent = c;
      tag.onclick = () => { item.cat = c; renderEditGrid(); };
      catsDiv.appendChild(tag);
    });
    inner.appendChild(catsDiv);
    div.appendChild(inner);
    const btnRm = document.createElement('button');
    btnRm.className = 'btn-rm';
    btnRm.textContent = '✕';
    btnRm.onclick = () => { pending = pending.filter(p => p.id !== item.id); renderEditGrid(); checkStep2(); };
    div.appendChild(btnRm);
    grid.appendChild(div);
  });
}

function checkStep2() {
  const allNamed = pending.length > 0 && pending.every(p => p.nombre.trim());
  document.getElementById('step2').style.display = pending.length > 0 ? '' : 'none';
  document.getElementById('emptyPanel').style.display = pending.length > 0 || results.length > 0 ? 'none' : '';
  document.getElementById('btnGenAll').disabled = !allNamed;
  document.getElementById('btnGenAll').textContent = allNamed
    ? 'Generar ' + pending.length + ' imagen' + (pending.length > 1 ? 'es' : '')
    : 'Completá los nombres para continuar';
  renderCats();
}

function renderCats() {
  const el = document.getElementById('cats');
  el.innerHTML = '';
  cats.forEach(c => {
    const tag = document.createElement('span');
    tag.className = 'cat' + (activeCat === c ? ' active' : '');
    tag.textContent = c;
    tag.onclick = () => { activeCat = c; renderCats(); };
    el.appendChild(tag);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'cat-add';
  addBtn.textContent = '+ Nueva';
  addBtn.onclick = openModal;
  el.appendChild(addBtn);
}

// Generar todas
async function generarTodas() {
  const btn = document.getElementById('btnGenAll');
  btn.disabled = true;
  const prog = document.getElementById('progress');
  results = [];
  for (let i = 0; i < pending.length; i++) {
    prog.textContent = 'Generando ' + (i+1) + ' de ' + pending.length + '...';
    const entry = pending[i];
    const blob = await generarCanvas(entry);
    results.push({ nombre: entry.nombre, blob, src: entry.src });
  }
  prog.textContent = '¡Listas!';
  pending = [];
  renderEditGrid();
  checkStep2();
  renderResults();
  btn.disabled = false;
}

function generarCanvas(entry) {
  return new Promise(resolve => {
    const W = 1080, H = 1920;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const photo = new Image();
    photo.onload = function() {
      const scale = Math.max(W / photo.width, H / photo.height);
      ctx.drawImage(photo, (W - photo.width*scale)/2, (H - photo.height*scale)/2, photo.width*scale, photo.height*scale);
      const grad = ctx.createLinearGradient(0, H*0.78, 0, H);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.38)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, H*0.78, W, H*0.22);
      const pad=48, nombreSize=58, linkSize=38;
      const boxH = nombreSize+linkSize+52;
      const boxX=pad, boxY=H-pad-boxH;
      ctx.save();
      ctx.beginPath();
      roundRect(ctx,boxX,boxY,W-pad*2,boxH,18);
      ctx.fillStyle='rgba(20,16,13,0.58)';
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.font='italic 400 '+nombreSize+'px Georgia,serif';
      ctx.fillStyle='#fff';
      ctx.shadowColor='rgba(0,0,0,0.4)';
      ctx.shadowBlur=8;
      ctx.textAlign='left';
      ctx.fillText(entry.nombre, boxX+28, boxY+nombreSize+16);
      ctx.restore();
      ctx.save();
      ctx.font='300 '+linkSize+'px sans-serif';
      ctx.fillStyle='rgba(255,255,255,0.75)';
      ctx.textAlign='left';
      ctx.fillText(LINK, boxX+28, boxY+nombreSize+linkSize+32);
      ctx.restore();
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.93);
    };
    photo.src = entry.src;
  });
}

function renderResults() {
  const panel = document.getElementById('resultsPanel');
  const grid = document.getElementById('resultsGrid');
  if (results.length === 0) { panel.style.display='none'; return; }
  panel.style.display = '';
  grid.innerHTML = '';
  document.getElementById('btnDlAll').onclick = () => {
    results.forEach((r,i) => setTimeout(() => dlBlob(r), i*400));
  };
  results.forEach(r => {
    const card = document.createElement('div');
    card.className = 'res-card';
    const img = document.createElement('img');
    img.src = r.src;
    card.appendChild(img);
    const body = document.createElement('div');
    body.className = 'res-card-body';
    body.innerHTML = '<div class="res-card-name">'+r.nombre+'</div>';
    const btn = document.createElement('button');
    btn.className = 'btn-dl-res';
    btn.textContent = 'Descargar';
    btn.onclick = () => dlBlob(r);
    body.appendChild(btn);
    card.appendChild(body);
    grid.appendChild(card);
  });
}

function dlBlob(r) {
  const fname = r.nombre.toLowerCase().replace(/[^a-z0-9]/gi,'-');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(r.blob);
  a.download = 'deperchas-'+fname+'.jpg';
  a.click();
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function openModal(){document.getElementById('catInput').value='';document.getElementById('modalBg').classList.add('open');setTimeout(()=>document.getElementById('catInput').focus(),50);}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}
function confirmCat(){const v=document.getElementById('catInput').value.trim();if(v&&!cats.includes(v)){cats.push(v);localStorage.setItem('dep_cats',JSON.stringify(cats));activeCat=v;renderCats();renderEditGrid();}closeModal();}
document.getElementById('catInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmCat();});
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

renderCats();
</script>
